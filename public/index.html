<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>SecureChat — Minimal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#000000;
  --panel:#080808;
  --card:#121212;
  --card-hover:#1a1a1a;
  --border:#222222;
  --border-light:#333333;
  --accent:#ffffff;
  --accent-inv:#000000;
  --text:#f0f0f0;
  --muted:#666666;
  --red:#ff4d4d;
  --me-bubble:#ffffff;
  --me-text:#000000;
  --them-bubble:#141414;
  --them-text:#f0f0f0;
}

[data-theme="light"] {
  --bg:#f0f0f0;
  --panel:#e4e4e4;
  --card:#ffffff;
  --card-hover:#f9f9f9;
  --border:#cccccc;
  --border-light:#dddddd;
  --accent:#000000;
  --accent-inv:#ffffff;
  --text:#111111;
  --muted:#666666;
  --red:#e53935;
  --me-bubble:#000000;
  --me-text:#ffffff;
  --them-bubble:#ffffff;
  --them-text:#111111;
}
html,body{
  height:100%;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ──── LOGIN ──── */
#login{
  display:flex;align-items:center;justify-content:center;
  height:100dvh;padding:1.5rem;background:var(--bg);
}
.card{
  background:var(--panel);border:1px solid var(--border);
  border-radius:16px;padding:2.5rem 2rem;width:100%;max-width:360px;
}
.card-icon{font-size:2.2rem;text-align:center;margin-bottom:1rem;color:var(--accent)}
.card h1{text-align:center;font-size:1.4rem;font-weight:700;letter-spacing:-0.02em;margin-bottom:.4rem}
.card p{text-align:center;color:var(--muted);font-size:.8rem;margin-bottom:2rem;line-height:1.5}
.field{
  width:100%;background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:.85rem 1rem;color:var(--text);font-size:.95rem;
  outline:none;transition:border-color .15s;margin-bottom:1rem;
  font-family:inherit;
}
.field:focus{border-color:var(--accent)}
.btn{
  width:100%;background:var(--accent);color:var(--accent-inv);border:none;
  border-radius:10px;padding:.85rem;font-size:.95rem;font-weight:600;
  cursor:pointer;transition:opacity .15s,transform .1s;
  display:flex;align-items:center;justify-content:center;gap:.5rem;
}
.btn:hover{opacity:.9}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;pointer-events:none}
#login-err{color:var(--red);font-size:.8rem;margin-top:.8rem;text-align:center;min-height:1.2rem}

/* ──── APP SHELL ──── */
#app{display:none;height:100dvh;flex-direction:row}
.layout{display:flex;height:100%;width:100%}

/* ──── SIDEBAR ──── */
.sidebar{
  width:300px;flex-shrink:0;
  background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;height:100%;
}
.sb-header{padding:1rem;border-bottom:1px solid var(--border)}
.me-row{display:flex;align-items:center;gap:.75rem;margin-bottom:1rem}
.av{
  width:38px;height:38px;border-radius:50%;background:var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:.95rem;flex-shrink:0;color:var(--accent-inv);
}
.me-name{font-weight:600;font-size:.9rem;letter-spacing:-0.01em}
.me-status{font-size:.7rem;color:var(--muted);display:flex;align-items:center;gap:.3rem;margin-top:1px}
.s-dot{width:5px;height:5px;background:var(--accent);border-radius:50%}

/* Navigation Tabs */
.tabs{display:flex;gap:.5rem;margin-bottom:.8rem;border-bottom:1px solid var(--border);padding-bottom:.6rem}
.tab-btn{
  flex:1;background:none;border:none;color:var(--muted);
  font-size:.8rem;font-weight:600;padding:.4rem 0;cursor:pointer;
  transition:color .15s;text-align:center;border-radius:6px;
}
.tab-btn.active{color:var(--accent);background:var(--card)}

.sb-search{position:relative}
.sb-search input{
  width:100%;background:var(--card);border:1px solid var(--border);
  border-radius:8px;padding:.55rem .8rem .55rem 2rem;
  color:var(--text);font-size:.85rem;outline:none;font-family:inherit;
  transition:border-color .15s;
}
.sb-search input:focus{border-color:var(--border-light)}
.sb-search .ico{position:absolute;left:.65rem;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.8rem}

.sb-list{flex:1;overflow-y:auto;padding:.5rem}
.sec-label{font-size:.65rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:.4rem .6rem}

/* List Items */
.ci{
  display:flex;align-items:center;gap:.7rem;padding:.6rem .7rem;
  border-radius:8px;cursor:pointer;transition:background .12s;margin-bottom:2px;
  border:1px solid transparent;
}
.ci:hover{background:var(--card)}
.ci.active{background:var(--card);border-color:var(--border)}
.ci-av{
  width:36px;height:36px;border-radius:50%;background:var(--card);
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:.85rem;color:var(--accent);flex-shrink:0;
}
.ci-info{flex:1;min-width:0}
.ci-name{font-weight:500;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-sub{font-size:.7rem;color:var(--muted);margin-top:1px}
.ci-btn{
  background:var(--accent);color:var(--accent-inv);border:none;
  border-radius:6px;padding:.3rem .6rem;font-size:.72rem;font-weight:600;
  cursor:pointer;transition:opacity .15s;flex-shrink:0;
}
.ci-btn:hover{opacity:.85}
.ci-btn.remove{background:transparent;color:var(--muted);border:1px solid var(--border)}
.ci-btn.remove:hover{color:var(--red);border-color:var(--red)}

.empty-hint{text-align:center;color:var(--muted);font-size:.8rem;padding:2rem 1rem;line-height:1.5}

/* ──── CHAT AREA ──── */
.chat{flex:1;display:flex;flex-direction:column;min-width:0;height:100%;position:relative;background:var(--bg)}
.chat-hdr{
  height:56px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 1rem;gap:.7rem;
  background:var(--panel);flex-shrink:0;
}
.back-btn{
  display:none;background:none;border:none;color:var(--muted);
  cursor:pointer;font-size:1.3rem;padding:.2rem .4rem;line-height:1;
}
.chat-hdr-av{
  width:32px;height:32px;border-radius:50%;background:var(--card);
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;color:var(--accent);font-size:.85rem;flex-shrink:0;
}
.chat-hdr-name{font-weight:600;font-size:.9rem}
.chat-hdr-sub{font-size:.68rem;color:var(--muted)}
.friend-toggle-btn{
  margin-left:auto;background:none;border:1px solid var(--border);
  color:var(--text);border-radius:6px;padding:.3rem .6rem;font-size:.72rem;
  cursor:pointer;transition:all .15s;
}
.friend-toggle-btn:hover{border-color:var(--border-light)}

/* Messages */
.msgs{
  flex:1;overflow-y:auto;padding:1.2rem;
  display:flex;flex-direction:column;gap:.6rem;
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
}
.welcome{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  color:var(--muted);text-align:center;padding:2rem;
}
.welcome .big{font-size:3rem;margin-bottom:.8rem;opacity:.2}
.welcome h2{color:var(--text);font-size:1.1rem;margin-bottom:.4rem;font-weight:600}
.welcome p{font-size:.8rem;max-width:260px;line-height:1.5}

.empty-chat{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  flex:1;color:var(--muted);text-align:center;
}
.empty-chat .ico{font-size:2.2rem;margin-bottom:.6rem;opacity:.3}
.empty-chat p{font-size:.8rem}

/* Bubbles */
.mrow{display:flex;align-items:flex-end;gap:.4rem}
.mrow.me{justify-content:flex-end}
.mrow.them{justify-content:flex-start}
.bubble.msg{
  max-width:85%;padding:.6rem .8rem;border-radius:12px;
  font-size:.9rem;line-height:1.4;position:relative;
  overflow-wrap:anywhere;word-break:break-word;white-space:pre-wrap;
}
.mrow.me .bubble{
  background:var(--me-bubble);color:var(--me-text);
  border-bottom-right-radius:2px;font-weight:400;
}
.mrow.them .bubble{
  background:var(--them-bubble);color:var(--them-text);
  border:1px solid var(--border);border-bottom-left-radius:2px;
}
.bubble-img{
  max-width:100%;max-height:260px;border-radius:8px;
  display:block;cursor:pointer;object-fit:cover;
  transition:opacity .15s,transform .15s;
}
.bubble-img:hover{opacity:.95;transform:scale(1.01)}
.mtime{font-size:.62rem;color:var(--muted);margin-top:.2rem;padding:0 .2rem}
.mrow.me .mtime{text-align:right}

/* Input Bar */
.input-bar{
  border-top:1px solid var(--border);background:var(--panel);
  padding:.75rem 1rem;padding-bottom:max(.75rem, env(safe-area-inset-bottom));
  flex-shrink:0;
}
.img-preview-bar{
  display:none;align-items:center;gap:.6rem;
  padding:.4rem .8rem;background:var(--card);
  border:1px solid var(--border);border-radius:8px;
  margin-bottom:.5rem;
}
.img-preview-bar img{
  width:40px;height:40px;object-fit:cover;
  border-radius:6px;border:1px solid var(--border);
}
.img-preview-bar .img-info{
  flex:1;font-size:.78rem;color:var(--muted);
}
.img-preview-bar .remove-img{
  background:transparent;border:none;color:var(--muted);
  cursor:pointer;font-size:1.1rem;padding:.2rem .4rem;
  transition:color .15s;
}
.img-preview-bar .remove-img:hover{color:var(--text)}

.input-row{display:flex;gap:.5rem;align-items:center}
.attach-btn{
  width:38px;height:38px;background:var(--card);border:1px solid var(--border);
  border-radius:8px;color:var(--text);font-size:1.1rem;cursor:pointer;
  flex-shrink:0;transition:border-color .15s,opacity .15s,transform .1s;
  display:flex;align-items:center;justify-content:center;
}
.attach-btn:hover{border-color:var(--border-light);opacity:.9}
.attach-btn:active{transform:scale(.95)}
#msg-input{
  flex:1;background:var(--card);border:1px solid var(--border);
  border-radius:8px;padding:.65rem .9rem;color:var(--text);
  font-size:16px;outline:none;transition:border-color .15s;
  font-family:inherit;
}
#msg-input:focus{border-color:var(--border-light)}
.send-btn{
  width:38px;height:38px;background:var(--accent);border:none;
  border-radius:8px;color:var(--accent-inv);font-size:1rem;cursor:pointer;
  flex-shrink:0;transition:opacity .15s,transform .1s;
  display:flex;align-items:center;justify-content:center;
}
.send-btn:hover{opacity:.85}
.send-btn:active{transform:scale(.95)}

/* Image Modal */
#img-modal{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.92);z-index:1000;
  align-items:center;justify-content:center;
  padding:1rem;cursor:zoom-out;
}
#img-modal img{
  max-width:95vw;max-height:92vh;border-radius:8px;
  box-shadow:0 0 40px rgba(0,0,0,0.9);object-fit:contain;
}

/* Toast */
#toast{
  position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--accent);color:var(--accent-inv);border-radius:20px;
  padding:.4rem 1rem;font-size:.78rem;font-weight:600;
  opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:999;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

@media(max-width:600px){
  .sidebar{
    position:fixed;inset:0;width:100%;z-index:20;
    transform:translateX(0);transition:transform .25s ease;
  }
  .sidebar.slide-out{transform:translateX(-100%)}
  .chat{width:100%}
  .back-btn{display:flex}
}
</style>
</head>
<body>

<!-- ──── LOGIN ──── -->
<div id="login">
  <div class="card">
    <div class="card-icon">░</div>
    <h1>SecureChat</h1>
    <p>Минималистичный зашифрованный мессенджер.</p>
    <form id="login-form">
      <input id="uname" class="field" type="text" placeholder="Ваш никнейм..." maxlength="30" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" required/>
      <input id="upass" class="field" type="password" placeholder="Пароль..." maxlength="50" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" required/>
      <button id="join-btn" type="submit" class="btn">Войти / Зарегистрироваться</button>
    </form>
    <button id="reset-login-btn" type="button" class="ci-btn remove" style="width:100%;margin-top:.8rem;padding:.65rem;border-color:var(--border)">Обнулить этот никнейм на сервере</button>
    <div id="login-err"></div>
  </div>
</div>

<!-- ──── APP ──── -->
<div id="app">
  <div class="layout">

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
      <div class="sb-header">
        <div class="me-row">
          <div class="av" id="my-av">?</div>
          <div>
            <div class="me-name" id="my-name">—</div>
            <div class="me-status"><span class="s-dot"></span>Online</div>
          </div>
          <button id="logout-btn" class="ci-btn remove" style="margin-left:auto">Выйти</button>
        </div>

        <div class="tabs">
          <button class="tab-btn active" id="tab-chats">Чаты</button>
          <button class="tab-btn" id="tab-friends">Друзья</button>
          <button class="tab-btn" id="tab-search">Поиск</button>
        </div>

        <div class="sb-search" id="search-box-wrap" style="display:none;margin-bottom:.5rem">
          <span class="ico">🔍</span>
          <input id="search" type="text" placeholder="Поиск по никнейму..." autocomplete="off"/>
        </div>
      </div>

      <div class="sb-list" id="sb-list">
        <div class="sec-label" id="list-title">Чаты</div>
        <div id="chat-list"><div class="empty-hint">Загрузка...</div></div>
      </div>
    </div>

    <!-- CHAT -->
    <div class="chat" id="chat-area">
      <!-- Welcome -->
      <div class="welcome" id="welcome">
        <div class="big">░</div>
        <h2>SecureChat</h2>
        <p>Выберите собеседника или добавьте друга через поиск</p>
      </div>

      <!-- Active Chat -->
      <div id="chat-view" style="display:none;flex-direction:column;height:100%">
        <div class="chat-hdr">
          <button class="back-btn" id="back-btn">←</button>
          <div class="chat-hdr-av" id="peer-av">?</div>
          <div>
            <div class="chat-hdr-name" id="peer-name">—</div>
            <div class="chat-hdr-sub">🔒 Зашифровано</div>
          </div>
          <button class="friend-toggle-btn" id="friend-toggle-btn">+ В друзья</button>
        </div>

        <div class="msgs" id="msgs">
          <div class="empty-chat" id="msgs-empty">
            <div class="ico">🔒</div>
            <p>Начните диалог. Сообщения удаляются через 24 часа.</p>
          </div>
        </div>

        <div class="input-bar">
          <input type="file" id="img-input" accept="image/*" style="display:none;"/>
          <div class="img-preview-bar" id="img-preview-bar">
            <img id="img-preview-thumb" alt="preview"/>
            <div class="img-info" id="img-preview-info">Фото прикреплено</div>
            <button class="remove-img" id="remove-img-btn" type="button" title="Удалить фото">✕</button>
          </div>
          <div class="input-row">
            <button class="attach-btn" id="attach-btn" type="button" title="Прикрепить фото">📷</button>
            <input id="msg-input" type="text" placeholder="Написать..." autocomplete="off" enterkeyhint="send"/>
            <button class="send-btn" id="send-btn">↑</button>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<div id="img-modal">
  <img id="img-modal-target" alt="full size"/>
</div>

<div id="toast"></div>

<script>
// ═══════════════════════════════════════
// CRYPTO
// ═══════════════════════════════════════
async function genKeys(){
  const kp=await crypto.subtle.generateKey(
    {name:'RSA-OAEP',modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:'SHA-256'},
    true,['encrypt','decrypt']
  );
  return{
    pub:await crypto.subtle.exportKey('jwk',kp.publicKey),
    priv:await crypto.subtle.exportKey('jwk',kp.privateKey)
  };
}
async function importPub(jwk){
  return crypto.subtle.importKey('jwk',jwk,{name:'RSA-OAEP',hash:'SHA-256'},false,['encrypt']);
}
async function importPriv(jwk){
  return crypto.subtle.importKey('jwk',jwk,{name:'RSA-OAEP',hash:'SHA-256'},false,['decrypt']);
}
function buf2b64(b){
  const bytes=new Uint8Array(b);
  let binary='';
  const len=bytes.byteLength;
  const chunkSize=0x8000;
  for(let i=0;i<len;i+=chunkSize){
    binary+=String.fromCharCode.apply(null,bytes.subarray(i,Math.min(i+chunkSize,len)));
  }
  return btoa(binary);
}
function b642buf(s){
  const b=atob(s),a=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);
  return a.buffer;
}

async function encFor(text,pubJwk){
  const pub=await importPub(pubJwk);
  const aes=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt','decrypt']);
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const enc=await crypto.subtle.encrypt({name:'AES-GCM',iv},aes,new TextEncoder().encode(text));
  const raw=await crypto.subtle.exportKey('raw',aes);
  const encKey=await crypto.subtle.encrypt({name:'RSA-OAEP'},pub,raw);
  return{c:buf2b64(enc),k:buf2b64(encKey),v:buf2b64(iv.buffer)};
}
async function dec(payload,privJwk){
  const priv=await importPriv(privJwk);
  const raw=await crypto.subtle.decrypt({name:'RSA-OAEP'},priv,b642buf(payload.k));
  const aes=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(b642buf(payload.v))},aes,b642buf(payload.c));
  return new TextDecoder().decode(plain);
}

// ═══════════════════════════════════════
// PBKDF2 WRAPPING (Save Private Key on Server)
// ═══════════════════════════════════════
async function getKek(password){
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), {name: 'PBKDF2'}, false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name: 'PBKDF2', salt: enc.encode('friendlychat_salt'), iterations: 100000, hash: 'SHA-256'},
    keyMaterial, {name: 'AES-GCM', length: 256}, false, ['encrypt', 'decrypt']
  );
}

async function wrapPrivKey(privJwk, password){
  const kek = await getKek(password);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const enc = await crypto.subtle.encrypt(
    {name: 'AES-GCM', iv}, kek, new TextEncoder().encode(JSON.stringify(privJwk))
  );
  return { c: buf2b64(enc), v: buf2b64(iv.buffer) };
}

async function unwrapPrivKey(wrappedObj, password){
  const kek = await getKek(password);
  const dec = await crypto.subtle.decrypt(
    {name: 'AES-GCM', iv: new Uint8Array(b642buf(wrappedObj.v))}, kek, b642buf(wrappedObj.c)
  );
  return JSON.parse(new TextDecoder().decode(dec));
}

// ═══════════════════════════════════════
// NOTIFICATIONS & AUDIO
// ═══════════════════════════════════════
let audioCtx=null;
function playNotifySound(){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    osc.type='sine';
    osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
    osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.08); // A5
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
  }catch(e){}
}

function requestNotifyPermission(){
  if('Notification' in window && Notification.permission==='default'){
    Notification.requestPermission().catch(()=>{});
  }
}

function showNotification(title,body){
  playNotifySound();
  if('Notification' in window && Notification.permission==='granted'){
    try{
      new Notification(title,{
        body:body,

// IMAGE COMPRESSION
// ═══════════════════════════════════════
function compressImage(file, maxDimension=1000, quality=0.8){
  return new Promise((resolve, reject)=>{
    const reader=new FileReader();
    reader.onload=(e)=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width, h=img.height;
        if(w>h){
          if(w>maxDimension){ h=Math.round((h*maxDimension)/w); w=maxDimension; }
        } else {
          if(h>maxDimension){ w=Math.round((w*maxDimension)/h); h=maxDimension; }
        }
        const canvas=document.createElement('canvas');
        canvas.width=w;
        canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',quality));
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

let toastTimer;
function toast(msg,dur=2500){
  clearTimeout(toastTimer);
  toastEl.textContent=msg;
  toastEl.classList.add('show');
  toastTimer=setTimeout(()=>toastEl.classList.remove('show'),dur);

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function tstr(ts){
  const d=ts?new Date(ts):new Date();
  return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}

function parseMsgPayload(raw){
  if(typeof raw==='object' && raw!==null) return raw;
  if(typeof raw==='string' && raw.startsWith('{')){
    try{ return JSON.parse(raw); }catch(e){}
  }
  return { type:'text', data:raw };
}

function addMsg(rawContent,isMe,ts){

  inner.style.alignItems=isMe?'flex-end':'flex-start';

  const bub=document.createElement('div');
  bub.className='bubble msg';

  const msgObj=parseMsgPayload(rawContent);

  if(msgObj && msgObj.type==='image'){
    const img=document.createElement('img');
    img.className='bubble-img';
    img.src=msgObj.data;
    img.onclick=()=>{
      imgModalTarget.src=msgObj.data;

    };
    bub.appendChild(img);
    if(msgObj.text){
      const cap=document.createElement('div');
      cap.style.marginTop='6px';
      cap.textContent=msgObj.text;
      bub.appendChild(cap);
    }
  }else{
    bub.textContent=msgObj && msgObj.data!==undefined ? msgObj.data : String(rawContent);
  }

  const time=document.createElement('div');
  time.className='mtime';
  time.textContent=tstr(ts);
  inner.appendChild(bub);
  inner.appendChild(time);
  row.appendChild(inner);
  msgsEl.appendChild(row);
  msgsEl.scrollTop=msgsEl.scrollHeight;
}

async function register(){
  const username=unameEl.value.trim();
  const password=upassEl.value.trim();
  loginErr.style.color='var(--red)';
  if(!username || !password){
    loginErr.textContent='Заполните никнейм и пароль';
    return;
  }
  if(!crypto.subtle){
    loginErr.textContent='Нужен HTTPS для работы шифрования!';
    return;
  }
  joinBtn.disabled=true;
  joinBtn.textContent='⏳ Подключение к серверу...';
  loginErr.textContent='';
  try{
    // Try to login to check if user exists
    let res=await fetch('/api/register',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username,password,publicKey:'dummy',encryptedPrivKey:'dummy'}) // dummy for check
    });
    
    let user=await res.json();
    if(!res.ok && res.status !== 400) { 
      // If 400, it might mean user doesn't exist and needs keys, which is expected
      if (res.status === 401) throw new Error(user.error || 'Неверный пароль');
    }

    if (res.ok && user.encryptedPrivKey) {
      // User exists, try to unwrap their private key
      try {
        const privJwk = await unwrapPrivKey(JSON.parse(user.encryptedPrivKey), password);
        myPriv = privJwk;
        me = user;
      } catch(e) {
        throw new Error('Ключ поврежден или неверный пароль (ошибка расшифровки: ' + e.message + ')');
      }
    } else {
      // New user registration
      const keys=await genKeys();
      const wrappedPriv=await wrapPrivKey(keys.priv, password);
      
      res=await fetch('/api/register',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({username,password,publicKey:JSON.stringify(keys.pub),encryptedPrivKey:JSON.stringify(wrappedPriv)})
      });
      user=await res.json();
      if(!res.ok) throw new Error(user.error || 'Ошибка при регистрации');
      me = user;
      myPriv = keys.priv;
    }

    localStorage.setItem('sc_u',JSON.stringify(me));
    localStorage.setItem('sc_p',JSON.stringify(myPriv));
    localStorage.setItem('sc_pwd',password);
    requestNotifyPermission();
    startApp();
  }catch(e){
    loginErr.style.color='var(--red)';
    loginErr.textContent='Ошибка: '+e.message;
    joinBtn.disabled=false;
    joinBtn.textContent='Войти / Зарегистрироваться';
  }
}

  e.preventDefault();
  register();
});

window.addEventListener('DOMContentLoaded',async ()=>{
  const themeToggle = document.getElementById('my-av');

  themeToggle.onclick = () => {
    const isLight = document.documentElement.getAttribute('data-theme') === 'light';
    const newTheme = isLight ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', newTheme);
    localStorage.setItem('sc_theme', newTheme);
  };
  if(localStorage.getItem('sc_theme') === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
  }

  try{
    const su=localStorage.getItem('sc_u');
    const sp=localStorage.getItem('sc_p');
    const spwd=localStorage.getItem('sc_pwd');
    if(su&&sp&&spwd){
      const u=JSON.parse(su);
      if(u&&u.id&&u.username){
        try{
          const res=await fetch('/api/register',{
            method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({username:u.username,password:spwd,publicKey:u.publicKey,encryptedPrivKey:'dummy'})
          });
          if(res.ok){
            const upd=await res.json();
            if(upd&&upd.id){
              me=upd;
              if (upd.encryptedPrivKey) {
                myPriv = await unwrapPrivKey(JSON.parse(upd.encryptedPrivKey), spwd);
              } else {
                myPriv = JSON.parse(sp); // Fallback for old accounts
              }
              localStorage.setItem('sc_u',JSON.stringify(upd));
              localStorage.setItem('sc_p',JSON.stringify(myPriv));
            }else{
              throw new Error('bad response');
            }
          }else{
            // Server rejected — password might be wrong, clear and show login
            localStorage.clear();
            return;
          }
        }catch(fetchErr){
          // Network error or decryption error: fall back to cached credentials
          me=u;
          myPriv=JSON.parse(sp);
        }
        requestNotifyPermission();
        startApp();
      }
    }
  }catch(e){
    console.error('auto-login err',e);
    localStorage.clear();
  }
});

// SOCKET
function connectSocket(){
  socket=io({transports:['websocket','polling']});
  socket.on('connect',()=>{
    socket.emit('register',me.id);
    toast('Подключено');
  });
  socket.on('disconnect',()=>toast('Соединение прервано'));

  socket.on('friend_request', async data=>{
    toast('Заявка в друзья от: '+data.senderName);
    showNotification('Заявка в друзья', data.senderName + ' хочет добавить вас');
    await loadFriends();
  });

  socket.on('friend_accepted', async data=>{
    toast(data.accepterName + ' принял(а) заявку');
    await loadFriends();
  });

  socket.on('private_message',async msg=>{
    let decrypted='[Зашифрованное сообщение]';
    try{
      const payload=JSON.parse(msg.encryptedContent);
      decrypted=await dec(payload,myPriv);
    }catch(e){console.error('dec err',e)}

    const parsed=parseMsgPayload(decrypted);
    let snippet='Новое сообщение';
    if(parsed.type==='image'){
      snippet='📷 Фотография'+(parsed.text?': '+parsed.text:'');
    }else if(parsed.type==='text'){
      snippet=parsed.data;
    }else{
      snippet=String(decrypted);
    }

    const sid=String(msg.senderId);
    const isCurrentChat=peer && String(peer.id)===sid;

    if(isCurrentChat){
      addMsg(decrypted,false,msg.timestamp);
      if(document.hidden){
        showNotification(peer.username, snippet);
      }
    }else{
      if(!pending[sid])pending[sid]=[];
      pending[sid].push({text:decrypted,ts:msg.timestamp});
      
      let senderName='Пользователь #'+sid;
      const found=myFriends.find(f=>String(f.id)===sid);
      if(found) senderName=found.username;

      showNotification(senderName, snippet);
      toast('💬 '+senderName+': '+snippet);
      if(activeTab==='chats') loadRecent();
    }
  });
}

// ═══════════════════════════════════════
async function loadFriends(){
  try{
    const [resF, resR] = await Promise.all([
      fetch('/api/friends/'+me.id),
      fetch('/api/friends/requests/'+me.id)
    ]);
    myFriends=await resF.json();
    incomingRequests=await resR.json();
    if(!Array.isArray(myFriends)) myFriends=[];
    if(!Array.isArray(incomingRequests)) incomingRequests=[];
    if(activeTab==='friends' && (!searchEl.value || !searchEl.value.trim())){
      renderFriendsList();
    }
    updateFriendToggleBtn();
  }catch(e){}
}

function isFriend(userId){
  return myFriends.some(f => String(f.id) === String(userId));
}

async function acceptRequest(user){
  try{
    await fetch('/api/friends/accept', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({senderId:user.id, receiverId:me.id})
    });
    toast('Заявка принята');
    await loadFriends();
  }catch(e){toast('Ошибка');}
}

async function rejectRequest(user){
  try{
    await fetch('/api/friends/reject', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({senderId:user.id, receiverId:me.id})
    });
    toast('Заявка отклонена');
    await loadFriends();
  }catch(e){toast('Ошибка');}
}

async function addFriend(user){
  try{
    const res = await fetch('/api/friends/request', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({senderId:me.id, receiverId:user.id})
    });
    const data = await res.json();
    if(data.accepted){
      toast('Вы взаимно приняли заявку!');
    } else {
      toast('Заявка отправлена');
      if(peer && String(peer.id)===String(user.id)){
        friendToggleBtn.textContent='⏳ Отправлено';
      }
    }
    await loadFriends();
    if(searchEl.value.trim()){
      triggerSearch();
    }
  }catch(e){toast('Ошибка отправки');}
}

async function removeFriend(user){
  try{
    await fetch('/api/friends/remove', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({userId:me.id, friendId:user.id})
    });
    toast('Удален из друзей');
    await loadFriends();
    if(searchEl.value.trim()){
      triggerSearch();
    }
  }catch(e){toast('Ошибка удаления');}
}

function updateFriendToggleBtn(){
  if(!peer) return;
  if(isFriend(peer.id)){
    friendToggleBtn.textContent='✓ В друзьях';
    friendToggleBtn.style.opacity='0.6';
  }else{
    friendToggleBtn.textContent='+ В друзья';
    friendToggleBtn.style.opacity='1';
  }
}

friendToggleBtn.onclick=async()=>{
  if(!peer) return;
  if(isFriend(peer.id)){
    await removeFriend(peer);
  }else{
    await addFriend(peer);
  }
  updateFriendToggleBtn();
};

  chatListEl.innerHTML='';
  if(!users.length){
    if(totalOnServer<=1){
      chatListEl.innerHTML='<div class="empty-hint">На сервере пока нет других пользователей.<br>Попросите друга зарегистрироваться по ссылке, чтобы начать общение!</div>';
    }else{
      chatListEl.innerHTML='<div class="empty-hint">Пользователи с таким ником не найдены</div>';

  }
  users.forEach(u=>{

        <div class="ci-name">${esc(u.username)}</div>
        <div class="ci-sub">${isF?'У вас в друзьях':'Пользователь'}</div>

      btns[1].onclick = (e) => { e.stopPropagation(); rejectRequest(u); };
      ci.querySelector('.ci-info').onclick = () => openChat(u);
      ci.querySelector('.ci-av').onclick = () => openChat(u);

    h.innerHTML = 'У вас пока нет друзей.<br>Найдите пользователя через поиск!';
    chatListEl.appendChild(h);
    return;
  }
  myFriends.forEach(u=>{
    const hasPend=pending[String(u.id)]?.length>0;
    const ci=document.createElement('div');
    ci.className='ci'+(peer&&String(peer.id)===String(u.id)?' active':'');
    ci.innerHTML=`
      <div class="ci-av">${esc(u.username[0].toUpperCase())}</div>
      <div class="ci-info">

    };

  });

function renderRecentList(users){
  chatListEl.innerHTML='';
  if(!users.length){
    chatListEl.innerHTML='<div class="empty-hint">Нет активных чатов.<br>Выберите друга или найдите через поиск!</div>';
    return;
  }
  users.forEach(u=>{
    const hasPend=pending[String(u.id)]?.length>0;
    const isF=isFriend(u.id);
    const ci=document.createElement('div');
    ci.className='ci'+(peer&&String(peer.id)===String(u.id)?' active':'');
    ci.innerHTML=`
      <div class="ci-av">${esc(u.username[0].toUpperCase())}</div>
      <div class="ci-info">
        <div class="ci-name">${esc(u.username)}${hasPend?' 🔴':''}</div>
        <div class="ci-sub">${isF?'Друг':'Чаты'}</div>
      </div>
    `;
    ci.onclick=()=>openChat(u);
    chatListEl.appendChild(ci);
  });
}

// ═══════════════════════════════════════
// OPEN CHAT
// ═══════════════════════════════════════
async function openChat(user){
  peer=user;
  sidebarEl.classList.add('slide-out');
  welcomeEl.style.display='none';
  chatViewEl.style.display='flex';
  peerAv.textContent=user.username[0].toUpperCase();
  peerName.textContent=user.username;
  updateFriendToggleBtn();

  msgsEl.innerHTML='';
  msgsEmpty.style.display='flex';
  msgsEl.appendChild(msgsEmpty);

  // Load history from server
  try{
    const res=await fetch(`/api/messages/${me.id}/${user.id}`);
    const history=await res.json();
    for(const msg of history){
      const isMe=String(msg.senderId)===String(me.id);
      let text='[Зашифровано]';
      try{
        const payload=JSON.parse(msg.encryptedContent);
        text=await dec(payload,myPriv);
      }catch(e){
        text=isMe?'[Отправлено со старым ключом]':'[Зашифровано старым ключом]';
      }
      addMsg(text,isMe,msg.timestamp);
    }
  }catch(e){console.error('history err',e)}

  // flush pending
  const pend=pending[String(user.id)]||[];
  for(const m of pend)addMsg(m.text,false,m.ts);
  delete pending[String(user.id)];

  if(activeTab==='chats') loadRecent();
  msgInput.focus();
}

// BACK (MOBILE)
backBtn.onclick=()=>{
  sidebarEl.classList.remove('slide-out');
  chatViewEl.style.display='none';
  welcomeEl.style.display='flex';
  peer=null;
  if(activeTab==='chats') loadRecent(); else renderFriendsList();
};

// SEND MESSAGE
async function send(){
  const text=msgInput.value.trim();
  if(!text && !selectedImageData) return;
  if(!peer || !socket) return;

  let payloadToSend;
  if(selectedImageData){
    payloadToSend=JSON.stringify({
      type:'image',
      data:selectedImageData,
      text:text||''
    });
  }else{
    payloadToSend=JSON.stringify({
      type:'text',
      data:text
    });
  }

  msgInput.value='';
  clearSelectedImage();

  let peerKey;
  try{peerKey=typeof peer.publicKey==='string'?JSON.parse(peer.publicKey):peer.publicKey}
  catch{toast('❌ Нет ключа получателя');return}

  let myKey;
  try{myKey=typeof me.publicKey==='string'?JSON.parse(me.publicKey):me.publicKey}
  catch{toast('❌ Нет своего ключа');return}

  try{
    const[forPeer,forMe]=await Promise.all([encFor(payloadToSend,peerKey),encFor(payloadToSend,myKey)]);
    socket.emit('private_message',{
      senderId:me.id,
      receiverId:peer.id,
      encryptedContent:JSON.stringify(forPeer),
      senderCopy:JSON.stringify(forMe)
    });
    addMsg(payloadToSend,true,null);
    if(activeTab==='chats') loadRecent();
  }catch(e){
    toast('❌ Ошибка: '+e.message);
    console.error(e);
  }
}

sendBtn.onclick=send;
msgInput.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();send()}};
</script>
